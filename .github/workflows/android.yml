name: Sally Launcher Android ARM64

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-arm64:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # NDK 25 = launcher JNI (ndkBuild), NDK 27 = FeatherGL (C++20 + 16KB pages)
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;25.2.9519653 ndk;27.3.13750724'

      - name: Cache FeatherGL third-party sources
        uses: actions/cache@v4
        with:
          path: feathergl/3rdparty
          key: feathergl-3rdparty-glslang-15.4.0-v1

      - name: Fetch glslang + SPIRV-Cross
        run: bash feathergl/setup_deps.sh

      - name: Build FeatherGL (libfeathergl.so)
        run: |
          set -e
          NDK27="$ANDROID_SDK_ROOT/ndk/27.3.13750724"
          cmake -S feathergl -B feathergl/build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK27/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_static -DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build feathergl/build --target feathergl -j"$(nproc)"
          ls -la feathergl/build/libfeathergl.so
          cp feathergl/build/libfeathergl.so ZalithLauncher/src/main/jniLibs/arm64-v8a/libfeathergl.so

      - name: Build LWJGL runtime JARs
        run: |
          chmod +x ./gradlew
          mkdir -p out
          ./gradlew jre_lwjgl3glfw:build --no-daemon

      - name: Build Sally Launcher (ARM64)
        run: ./gradlew ZalithLauncher:assembleDebug -Darch=arm64 --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sally-Launcher-Android-arm64
          path: ZalithLauncher/build/outputs/apk/debug/*arm64*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload FeatherGL .so (standalone)
        uses: actions/upload-artifact@v4
        with:
          name: libfeathergl-arm64
          path: feathergl/build/libfeathergl.so
          retention-days: 14
